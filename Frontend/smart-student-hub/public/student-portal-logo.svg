<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="purpleBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#purpleBlueGradient)" opacity="0.95"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#purpleBlueGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Graduation cap -->
  <g transform="translate(50, 50)">
    <!-- Cap top (flat part) -->
    <ellipse cx="0" cy="-8" rx="22" ry="6" fill="white"/>
    <path d="M -22 -8 L -18 -2 L 18 -2 L 22 -8" fill="white" opacity="0.8"/>
    
    <!-- Cap middle section -->
    <path d="M -18 -2 Q -20 2 -18 6 L 18 6 Q 20 2 18 -2" fill="white"/>
    
    <!-- Tassel -->
    <line x1="0" y1="6" x2="0" y2="18" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="20" r="2.5" fill="white"/>
    
    <!-- Mortarboard detail -->
    <rect x="-20" y="-10" width="40" height="3" fill="white" opacity="0.9" rx="1"/>
  </g>
</svg>
